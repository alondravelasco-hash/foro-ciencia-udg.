<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Staff | Foro Ciencia UDG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Escáner QR JS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-dark-bg: rgba(44, 30, 22, 0.75);
            --btn-brown: #6b4c3a;
            --accent-amber: #d99a73;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #3b302c;
            color: #ffffff; overflow-x: hidden;
        }
        .bg-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #4a3e39 0%, #2b211e 100%); 
            z-index: -1; 
        }
        .glass-dark { 
            background: var(--glass-dark-bg); backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            color: white; transition: all 0.3s ease; 
        }
        .top-nav-glass { background: rgba(35, 26, 22, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        #reader { width: 100%; border-radius: 1rem; overflow: hidden; border: none !important; }
        #reader video { object-fit: cover; border-radius: 1rem; width: 100% !important; }
        #reader__dashboard_section_csr span { color: white !important; }
        #reader__dashboard_section_swaplink { color: var(--accent-amber) !important; text-decoration: none; margin-top: 10px; display: inline-block; }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans antialiased">
    <div class="bg-overlay"></div>

    <header class="pt-6 pb-2 px-4 z-40 sticky top-0 flex justify-center">
        <div class="top-nav-glass rounded-full px-6 py-3 flex items-center justify-between gap-4 max-w-7xl w-full shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-[#d99a73]/20 flex items-center justify-center border border-[#d99a73]/30">
                    <i class="fa-solid fa-clipboard-check text-[#d99a73] text-sm"></i>
                </div>
                <span class="font-light tracking-wide text-sm hidden sm:inline">Panel de Staff <span class="font-semibold opacity-70">Foro Ciencia</span></span>
            </div>
            
            <div class="flex gap-2">
                <button onclick="exportToCSV()" class="px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-medium transition-all flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Respaldar CSV</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-light tracking-tight mb-2">Control de Asistencia</h1>
            <p class="text-[#d99a73] font-medium text-sm tracking-widest uppercase">Escáner Oficial</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 relative items-start">
            
            <div class="lg:col-span-2 space-y-8 pb-10">
                <!-- Día 1 -->
                <div class="glass-dark p-6 md:p-8 rounded-[2rem]">
                    <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                        <div class="w-10 h
