<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de QR | Foro Ciencia UDG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #3b302c;
            color: #ffffff;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #4a3e39 0%, #2b211e 100%);
            z-index: -1;
        }
        .glass-dark {
            background: rgba(44, 30, 22, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        #qrcode img,
        #qrcode canvas {
            margin: 0 auto;
            border-radius: 0.75rem;
            border: 8px solid #ffffff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-overlay"></div>

    <div class="w-full max-w-md glass-dark p-6 md:p-8 rounded-[2rem]">
        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
            <div>
                <h1 class="text-2xl font-light">Pase Digital QR</h1>
                <p class="text-[#d99a73] text-xs uppercase tracking-widest font-semibold">Foro Ciencia UDG</p>
            </div>
            <span id="db-status" class="px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">
                Conectando...
            </span>
        </div>

        <form id="qr-form" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1">Nombre completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Ana López" class="w-full px-4 py-3 rounded-xl bg-black/30 border border-white/10 text-white focus:outline-none focus:border-[#d99a73]">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1">Tipo de asistente</label>
                <select id="tipo" class="w-full px-4 py-3 rounded-xl bg-[#2b211e] border border-white/10 text-white focus:outline-none focus:border-[#d99a73]">
                    <option value="Estudiante">Estudiante</option>
                    <option value="Ponente">Ponente</option>
                    <option value="Investigador">Investigador</option>
                    <option value="Público General">Público General</option>
                </select>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1">Organización / Escuela</label>
                <input type="text" id="organizacion" required placeholder="Ej. UDG / CUCEI" class="w-full px-4 py-3 rounded-xl bg-black/30 border border-white/10 text-white focus:outline-none focus:border-[#d99a73]">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-white/70 mb-1">Días de asistencia</label>
                <select id="dias" class="w-full px-4 py-3 rounded-xl bg-[#2b211e] border border-white/10 text-white focus:outline-none focus:border-[#d99a73]">
                    <option value="Ambos días (3 y 4 Dic)">Ambos días (3 y 4 Dic)</option>
                    <option value="3 de Dic">Solo 3 de Diciembre</option>
                    <option value="4 de Dic">Solo 4 de Diciembre</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 mt-2 rounded-xl bg-[#6b4c3a] hover:bg-[#d99a73] hover:text-black font-semibold transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode"></i> Generar mi QR
            </button>
        </form>

        <!-- CONTENEDOR DEL QR GENERADO -->
        <div id="qr-result" class="hidden mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-sm text-white/80 mb-4">Muestra este código en la entrada de cada actividad:</p>
            <div id="qrcode" class="flex justify-center mb-4"></div>
            <p id="qr-name-label" class="text-lg font-medium text-[#d99a73] mb-4"></p>
            <button id="download-button" type="button" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-medium transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Descargar QR
            </button>
        </div>
    </div>

    <script>
        const driveUrl = "https://script.google.com/macros/s/AKfycbybEWP1cNPrtsMtxw6VmMeiPPEb3t05YydfmCuolTTyRojupSoyBzmDNyEnlPzGpff0/exec";

        // Verificar conexión automática al abrir
        async function checkConnection() {
            const dbStatus = document.getElementById('db-status');
            try {
                const res = await fetch(driveUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error("Error");
                dbStatus.innerText = "Conectado";
                dbStatus.className = "px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-bold bg-green-500/20 text-green-400 border border-green-500/30";
            } catch (err) {
                dbStatus.innerText = "Modo local";
                dbStatus.className = "px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30";
            }
        }

        document.addEventListener('DOMContentLoaded', checkConnection);

        function descargarQR() {
            const nombre = document.getElementById('nombre').value.trim();
            const nombreArchivo = nombre ? nombre.replace(/\s+/g, '_') : 'Invitado';
            const link = document.createElement('a');
            link.download = `QR_ForoCiencia_${nombreArchivo}.png`;
            link.style.display = 'none';
            document.body.appendChild(link);

            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.body.removeChild(link);
                return true;
            }

            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                link.href = img.src;
                link.click();
                document.body.removeChild(link);
                return true;
            }

            document.body.removeChild(link);
            return false;
        }

        document.getElementById('qr-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const tipo = document.getElementById('tipo').value;
            const organizacion = document.getElementById('organizacion').value.trim();
            const dias = document.getElementById('dias').value;

            if (!nombre || !organizacion) {
                document.getElementById('qr-form').reportValidity();
                return;
            }

            if (typeof QRCode === 'undefined') {
                alert("No se pudo cargar el generador de QR. Revisa tu conexión e inténtalo de nuevo.");
                return;
            }

            // Formato exacto que espera el escáner de Control de Staff
            const qrPayload = JSON.stringify({
                n: nombre,
                t: tipo,
                o: organizacion,
                d: dias
            }).replace(/[\u0080-\uFFFF]/g, function(caracter) {
                return '\\u' + caracter.charCodeAt(0).toString(16).padStart(4, '0');
            });

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            try {
                new QRCode(qrContainer, {
                    text: qrPayload,
                    width: 220,
                    height: 220,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (error) {
                console.error("No se pudo generar el QR.", error);
                alert("No se pudo generar el QR. Revisa que el nombre y la organización no sean demasiado largos e inténtalo de nuevo.");
                return;
            }

            document.getElementById('qr-name-label').innerText = `${nombre} • ${tipo}`;
            document.getElementById('qr-result').classList.remove('hidden');

            // Descargar automaticamente despues de que qrcodejs termine de dibujar el PNG.
            const esperarDescarga = (intentosRestantes = 20) => {
                if (descargarQR()) return;
                if (intentosRestantes > 0) {
                    setTimeout(() => esperarDescarga(intentosRestantes - 1), 100);
                    return;
                }
                alert("El QR se generó, pero no se pudo descargar automáticamente. Usa el botón Descargar QR.");
            };
            setTimeout(esperarDescarga, 150);

            // Registrar la creación del pase en Google Drive
            const registroInicial = {
                Nombre: nombre,
                Tipo: tipo,
                Organizacion: organizacion,
                DiasRegistrados: dias,
                Conferencia: "Registro General (QR)",
                Dia: dias,
                Hora: "Generación de QR",
                Timestamp: new Date().toLocaleString()
            };

            fetch(driveUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(registroInicial)
            }).catch(() => {
                // El QR sigue funcionando aunque el registro remoto no esté disponible.
            });
        });

        ['tipo', 'dias'].forEach(function(id) {
            document.getElementById(id).addEventListener('change', function() {
                const form = document.getElementById('qr-form');
                if (form.checkValidity()) {
                    form.requestSubmit();
                }
            });
        });

        document.getElementById('download-button').addEventListener('click', descargarQR);
    </script>
</body>
</html>
